name: Check campus (Pages publishes main)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-world.mjs
      - run: node scripts/check-corrections.mjs
      - run: node scripts/check-character.mjs
