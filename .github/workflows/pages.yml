name: Check campus (Pages publishes main)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-world.mjs
      - run: node scripts/check-corrections.mjs
      - run: node scripts/check-character.mjs
      - run: node scripts/check-v6.mjs
      - run: node scripts/check-transit.mjs
      - run: node scripts/check-pitch.mjs
      - run: node scripts/check-lighting.mjs
      - run: node scripts/check-campus-levels.mjs
      - run: node scripts/check-campus-routes.mjs
      - run: node scripts/check-campus-life.mjs
      - run: node --experimental-vm-modules scripts/check-controls.mjs
      - run: python3 scripts/check-browser.py
      - name: Verify the public GitHub Pages files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-published.mjs https://swasthik-visakh-s.github.io/iist-campus-walk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-browser-views
          path: browser-checks/*.png
          if-no-files-found: ignore
